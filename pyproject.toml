[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chhaya"
version = "0.1.0"
description = "A self-improving, autonomous agent factory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "chromadb",
    "typer",
    "rich",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "apscheduler",
    "SpeechRecognition",
    "pyaudio",

    "pygame",
    "edge-tts",
    "structlog",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff"
]

[project.scripts]
chhaya = "chhaya.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chhaya"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
